<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>360° Gesture Test Environment</title>
    <meta name="description" content="360° Gesture Test Environment">
    <!-- Load A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <!-- Gesture Overlay -->
    <div id="gesture-overlay">
      <div id="gesture-display">Waiting for gestures...</div>
    </div>

    <!-- Simple Config Panel -->
    <div id="config-panel" style="position:fixed; right:10px; top:10px; background:rgba(0,0,0,0.6); color:#fff; padding:12px; border-radius:6px; font-family:Arial, sans-serif; z-index:9999; width:220px;">
      <div style="font-weight:bold; margin-bottom:8px;">VisionInput — Live Config</div>
      <div style="font-size:13px; margin-bottom:6px;">Finger bend threshold: <span id="bend-val">30°</span></div>
      <input id="bend-slider" type="range" min="0" max="90" step="1" value="30" style="width:100%;">
      <div style="margin-top:8px; display:flex; gap:8px;">
        <button id="save-config" style="flex:1;">Save</button>
        <button id="reload-config" style="flex:1;">Reload</button>
      </div>
      <div id="config-status" style="margin-top:8px; font-size:12px; color:#ccc;">Disconnected</div>
    </div>

    <!-- A-Frame Scene -->
    <a-scene>
      <a-assets>
        <!-- Placeholder 360 image from A-Frame examples -->
        <img id="sky" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/city.jpg" crossorigin="anonymous">
      </a-assets>

      <!-- 360 Background -->
      <a-sky src="#sky"></a-sky>

      <!-- Camera Rig for movement -->
      <a-entity id="camera-rig" position="0 1.6 0">
        <a-camera id="camera" look-controls wasd-controls="enabled: false"></a-camera>
      </a-entity>
    </a-scene>

    <!-- Load custom script after A-Frame -->
    <script src="js/app.js"></script>
  </body>
</html>
